name: FutureEval Fall 2026 Autonomous Run

on:
  workflow_dispatch:
  schedule:
    - cron: "11,31,51 * * * *"

concurrency:
  group: futureeval-fall-2026
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: futureeval_bot
    steps:
      - name: Check Fall 2026 start date
        id: gate
        shell: bash
        run: |
          NOW=$(date -u +%s)
          START=$(date -u -d "2026-09-28T00:00:00Z" +%s)
          if [ "$NOW" -ge "$START" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Fall FutureEval window is open."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Not starting forecasts before 2026-09-28."
          fi
      - name: Checkout
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
      - name: Python
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        if: steps.gate.outputs.ready == 'true'
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install
        if: steps.gate.outputs.ready == 'true'
        run: poetry install --no-interaction --no-root
      - name: Forecast
        if: steps.gate.outputs.ready == 'true'
        run: poetry run python main.py --mode tournament
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
